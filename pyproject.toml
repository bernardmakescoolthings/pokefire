[project]
name = "pokefire"
version = "0.1.0"
description = "An eBay watchlist monitor using Scrapingdog, with local listings and price history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["uvicorn>=0.34,<1"]

[project.scripts]
pokefire = "pokefire.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pokefire"]

[tool.setuptools.package-data]
pokefire = ["static/*"]
